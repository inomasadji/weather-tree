<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Tree</title>
  <meta name="description" content="Пиксельный погодный экран с живым деревом: сезон, время суток и погода в одном кадре.">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #0b1026;
      color: #cfe3ef;
      font: 16px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      padding: 2rem;
    }
    main { max-width: 42rem; }
    h1 {
      margin: 0 0 .25rem;
      font-size: clamp(2rem, 8vw, 3.5rem);
      letter-spacing: .02em;
      color: #a8d46a;
      text-shadow: 3px 3px 0 #2f6b32;
    }
    p { margin: .5rem 0; color: #8fb6d9; }
    code { color: #f0c088; }
    .status {
      display: inline-block;
      margin-top: 1rem;
      padding: .25rem .6rem;
      border: 2px solid #3f8a3d;
      color: #a8d46a;
      text-transform: uppercase;
      letter-spacing: .12em;
      font-size: .75rem;
    }
    a { color: #f0c088; }
  </style>
</head>
<body>
  <main>
    <h1>Weather Tree</h1>
    <p>Пиксельное дерево, которое живёт по времени года, времени суток и текущей погоде.</p>
    <p>Сцена появится здесь на этапе M2–M5. План разработки — в репозитории:
      <a href="https://github.com/inomasadji/weather-tree/blob/main/docs/PLAN.md">docs/PLAN.md</a>.
    </p>
    <span class="status">M0 · каркас</span>
  </main>
</body>
</html>
