<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Tree — погода и дерево</title>
  <meta name="description" content="Пиксельный погодный экран с живым деревом: сезон, время суток и погода в одном кадре.">
  <meta name="theme-color" content="#070b18">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%230b1026'/%3E%3Crect x='7' y='9' width='2' height='6' fill='%236b4a2f'/%3E%3Crect x='3' y='5' width='10' height='3' fill='%233f8a3d'/%3E%3Crect x='4' y='3' width='8' height='6' fill='%233f8a3d'/%3E%3Crect x='5' y='2' width='6' height='2' fill='%235aa84a'/%3E%3Crect x='6' y='8' width='4' height='1' fill='%232f6b32'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <section class="stage" id="stage">
      <canvas id="scene" width="320" height="180" role="img" aria-label="Сцена: дерево и погода"></canvas>

      <div class="hud">
        <div class="hud__clock">
          <span class="clock" id="clock-time" aria-live="polite">--:--</span>
          <span class="clock__seconds" id="clock-seconds" aria-hidden="true">--</span>
        </div>
        <p class="hud__date" id="clock-date">—</p>

        <div class="hud__weather">
          <span class="temp" id="temp">—</span>
          <div class="hud__weather-text">
            <p class="condition" id="condition">—</p>
            <p class="feels" id="feels">—</p>
          </div>
        </div>

        <dl class="details">
          <div class="details__item">
            <dt id="label-wind">Ветер</dt>
            <dd id="wind">—</dd>
          </div>
          <div class="details__item">
            <dt id="label-humidity">Влажность</dt>
            <dd id="humidity">—</dd>
          </div>
          <div class="details__item">
            <dt id="label-cloud">Облачность</dt>
            <dd id="cloud">—</dd>
          </div>
        </dl>

        <p class="hud__sun" id="sun-times">—</p>

        <p class="hud__message" id="hud-message" hidden></p>
      </div>

      <footer class="bar">
        <button class="place" id="place-btn" type="button" title="Сменить город">
          Определяем местоположение…
        </button>
        <div class="bar__right">
          <span class="source" id="source" data-state="loading">загрузка</span>
          <button class="icon-btn lang-btn" id="lang-btn" type="button" title="Switch language to English">RU</button>
          <button class="icon-btn" id="refresh-btn" type="button" aria-label="Обновить погоду" title="Обновить">↻</button>
        </div>
      </footer>
    </section>
  </div>

  <dialog class="dialog" id="place-dialog" aria-labelledby="place-title">
    <form method="dialog" class="dialog__head">
      <h2 class="dialog__title" id="place-title">Где смотрим погоду</h2>
      <button class="dialog__close" id="place-close" value="cancel" aria-label="Закрыть">×</button>
    </form>

    <label class="dialog__search">
      <span class="sr-only" id="place-search-label">Название города</span>
      <input
        id="place-input"
        type="search"
        placeholder="Москва, Берлин, Сидней…"
        autocomplete="off"
        spellcheck="false"
        enterkeyhint="search"
      >
    </label>

    <ul class="results" id="place-results" aria-label="Найденные города"></ul>
    <p class="dialog__status" id="place-status" role="status"></p>
  </dialog>

  <noscript>
    <p class="noscript">Для погодного экрана нужен JavaScript.</p>
  </noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
